name: auto-label

# PR·이슈에 작성자 라벨과 type 라벨을 자동으로 붙인다.
# - 작성자 라벨: 아래 AUTHOR_LABELS 대응표에 있는 계정만. 다른 사람 라벨은 건드리지 않는다.
# - type 라벨: 제목의 type(docs/git-conventions.md)과 같은 이름의 라벨 하나만 남긴다.
#   제목이 형식에 맞지 않으면 type 라벨은 건드리지 않는다.
# pull_request_target은 코드를 checkout하지 않고 제목·작성자 메타데이터만 읽으므로 안전하다.

on:
  pull_request_target:
    types: [opened, reopened, edited]
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const AUTHOR_LABELS = {
              hamxxn: '❄️ 동희',
              Tnalxmsk: '☃️ 민수',
              sminha: '🧦 민하',
              'seunghye-rain': '🫧 승혜',
            };
            const TYPES = ['feat', 'fix', 'refactor', 'style', 'docs', 'test', 'perf', 'build', 'ci', 'chore', 'revert'];

            const target = context.payload.pull_request ?? context.payload.issue;
            const currentLabels = target.labels.map((label) => label.name);
            const issueParams = { ...context.repo, issue_number: target.number };

            const labelsToAdd = [];
            const authorLabel = AUTHOR_LABELS[target.user.login];
            if (authorLabel && !currentLabels.includes(authorLabel)) {
              labelsToAdd.push(authorLabel);
            }

            const typeMatch = target.title.match(new RegExp(`^(${TYPES.join('|')})(\\([a-z-]+\\))?!?: `));
            if (typeMatch) {
              const type = typeMatch[1];
              const staleTypeLabels = currentLabels.filter((name) => TYPES.includes(name) && name !== type);
              for (const name of staleTypeLabels) {
                await github.rest.issues.removeLabel({ ...issueParams, name });
              }
              if (!currentLabels.includes(type)) {
                labelsToAdd.push(type);
              }
            }

            // addLabels는 없는 라벨을 새로 만들어 버리므로, 저장소에 이미 있는 라벨만 붙인다.
            const repoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            const existingLabels = new Set(repoLabels.map((label) => label.name));
            const missingLabels = labelsToAdd.filter((name) => !existingLabels.has(name));
            const applicableLabels = labelsToAdd.filter((name) => existingLabels.has(name));

            if (applicableLabels.length > 0) {
              await github.rest.issues.addLabels({ ...issueParams, labels: applicableLabels });
            }
            if (missingLabels.length > 0) {
              core.warning(`저장소에 없는 라벨이라 건너뜀: ${missingLabels.join(', ')}`);
            }
            core.info(`#${target.number}: +[${applicableLabels.join(', ')}]`);
